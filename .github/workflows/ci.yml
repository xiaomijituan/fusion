name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run scenario:check
      - name: Install the browser the QA walk drives
        run: npx playwright install --with-deps chromium
      - name: Browser QA walk against the production build
        run: node scripts/ci-qa.mjs
