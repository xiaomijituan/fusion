name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run scenario:check
      - name: Install the browser the QA walk drives
        run: npx playwright install --with-deps chromium
      - name: Browser QA walk against the production build
        run: node scripts/ci-qa.mjs
      - name: Bundle the release artifacts and run them like the handbook CI would
        # Last, because the projector is smoked on the .jsonl the walk just downloaded
        # (screenshots/qa-8-run.jsonl) — real app output beats a hand-written fixture.
        run: |
          npm run artifacts
          node output/artifacts/scenario-check.mjs scenarios/six-desk.json
          node output/artifacts/review-cli.mjs screenshots/qa-8-run.jsonl
